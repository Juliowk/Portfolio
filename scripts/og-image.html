<!doctype html>
<!-- Template da og-image.png (1200×630). Renderize num navegador em 1200×630 e salve em public/og-image.png. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0A0A0A;
    background-image:
      radial-gradient(600px 420px at 78% 40%, rgba(255,255,255,.09), transparent 70%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: auto, 64px 64px, 64px 64px;
    color: #F5F5F5; font-family: 'Geist', system-ui, sans-serif; position: relative;
  }
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .badge { display: inline-flex; align-items: center; gap: 12px; padding: 7px 20px 7px 7px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(255,255,255,.03); font-size: 20px; color: #C9C9C9; width: max-content; }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: #F5F5F5; color: #0A0A0A; display: flex; align-items: center; justify-content: center; font: 700 14px 'Geist Mono', monospace; }
  h1 { margin: 0; font-size: 96px; line-height: .95; letter-spacing: -0.045em; font-weight: 600;
       background: linear-gradient(180deg, #FFFFFF 0%, #F2F2F2 45%, #7A7A7A 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-top: 8px; }
  .role { font-size: 34px; color: #A3A3A3; letter-spacing: -0.02em; }
  .stack { font: 500 20px 'Geist Mono', monospace; color: #8A8A8A; }
  .stack b { color: #4ADE80; font-weight: 500; }
  .glyph { position: absolute; right: 70px; top: 120px; font: 500 300px/1 'Geist Mono', monospace; letter-spacing: -0.08em;
           background: linear-gradient(120deg,#5A5A5A 0%,#FFFFFF 18%,#9A9A9A 32%,#2B2B2B 48%,#E8E8E8 62%,#8C8C8C 78%,#FFFFFF 100%);
           -webkit-background-clip: text; background-clip: text; color: transparent; transform: rotate(-8deg);
           filter: drop-shadow(0 22px 40px rgba(255,255,255,.10)); }
  .ring { position: absolute; right: -10px; top: 60px; width: 500px; height: 500px; border: 1px solid rgba(255,255,255,.09); border-radius: 50%; }
  .dot { position: absolute; left: 50%; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #F5F5F5; box-shadow: 0 0 14px 2px rgba(255,255,255,.7); }
</style>
</head>
<body>
  <div class="ring"><span class="dot"></span></div>
  <div class="glyph">{ }</div>
  <div class="copy">
    <span class="badge"><span class="mark">JR</span>juliowk.github.io/Portfolio</span>
    <h1>Júlio Rocha</h1>
    <div class="role">Desenvolvedor Full Stack</div>
    <div class="stack"><b>&gt;</b> Python · Django · Angular · Java</div>
  </div>
</body>
</html>
